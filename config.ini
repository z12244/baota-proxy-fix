# 宝塔面板地址：系统代理（梯子）开启时自动加入 Windows 代理例外，多个用逗号分隔
# 面板换 IP 时改这里即可
hosts=8.153.176.147

# 是否同时加入 <local>（本机/局域网直连），1=是，0=否
keep_local=1

# 【v1.1 新增】检测"系统代理开着、但代理端口没有任何程序监听"的死代理状态，
# 持续 grace_seconds 秒后自动关闭系统代理并刷新 DNS。
# 设为 0 可关闭该行为，恢复成旧版只维护例外列表。
repair_dead_proxy=1

# 死代理要连续持续多少秒才判定并修复。留出余量，避免和加速器「先写代理、后起监听」抢跑。
grace_seconds=10

# 轮询间隔（秒）
poll_seconds=2
